<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Plamily — Painel Financeiro</title>

<script>
  // Aplica o tema salvo (claro/lavanda ou grafite) antes de qualquer coisa
  // renderizar, pra não dar um "flash" da cor errada por um instante.
  try {
    var savedTheme = localStorage.getItem("plamily-theme");
    var themeColors = { grafite: "#2C3E50", escuro: "#131417" };
    if (savedTheme === "grafite" || savedTheme === "escuro") {
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.addEventListener("DOMContentLoaded", function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", themeColors[savedTheme]);
      });
    }
  } catch (e) {}
</script>

<!-- Precisa vir bem no início: captura qualquer erro de carregamento e
     mostra ele na própria tela (em vez de só travar sem explicação),
     pra dar pra diagnosticar só com um print, sem precisar abrir o
     console do navegador. -->
<script>
  function __lumenShowError(msg) {
    var loader = document.getElementById("boot-loader");
    if (!loader) return;
    if (window.__lumenBootTimeout) clearTimeout(window.__lumenBootTimeout);
    if (loader.dataset.errorShown) return; // mostra só o primeiro erro, evita spam
    loader.dataset.errorShown = "1";
    loader.innerHTML =
      '<div style="font-size:28px;">⚠️</div>' +
      '<div style="max-width:320px;text-align:center;line-height:1.5;">' +
      'Deu um erro ao carregar o app.<br/>Tire um print desta tela (com o texto abaixo) e envie para o suporte:' +
      '</div>' +
      '<div style="max-width:320px;background:#2a2033;color:#ffb4b4;font-family:monospace;font-size:11px;' +
      'padding:10px;border-radius:8px;margin-top:4px;text-align:left;white-space:pre-wrap;word-break:break-word;' +
      'max-height:220px;overflow:auto;">' +
      String(msg || "erro desconhecido").replace(/</g, "&lt;") +
      '</div>';
  }
  window.addEventListener("error", function (e) {
    // Falha ao CARREGAR um recurso (ex: <script src> de uma CDN bloqueada
    // ou fora do ar) dispara aqui, mas só chega até este listener porque
    // está em fase de "captura" (3º parâmetro "true" do addEventListener
    // abaixo) — sem isso, esse tipo de erro específico passa despercebido.
    if (e.target && e.target !== window && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href || "(url desconhecida)";
      __lumenShowError("Não foi possível carregar um recurso externo (verifique bloqueadores de anúncio/rastreadores ou a conexão):\n" + url);
      return;
    }
    var msg = (e && e.message) || "Erro";
    var where = e && e.filename ? ("\n" + e.filename + ":" + e.lineno + ":" + e.colno) : "";
    __lumenShowError(msg + where);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e && e.reason;
    var msg = reason && reason.message ? reason.message : String(reason);
    __lumenShowError("Erro assíncrono: " + msg);
  });
</script>

<style>
  :root {
    --bg: #F7F6FA; --surface: #FFFFFF; --surface-alt: #EFEDF4; --lavender: #DCD9E8;
    --purple: #B8AED0; --pink: #D9CFDB; --pink-light: #F1EEF2; --accent-purple: #6B5B95;
    --accent-pink: #8C6B7D; --accent-purple-tint: #E6E2EF; --accent-pink-tint: #EDE6E9;
    --text-dark: #332F3D; --text-muted: #7A7488; --border: #E2DFEA;
    --green: #56B08A; --orange: #D99A2B; --danger: #D65C6E; --blue: #5B8BD6;
  }
  html[data-theme="grafite"] {
    --bg: #EEF1F4; --surface: #FFFFFF; --surface-alt: #E3E8EC; --lavender: #D8E0E6;
    --purple: #AAB9C4; --pink: #C9D6DC; --pink-light: #EEF3F5; --accent-purple: #2C3E50;
    --accent-pink: #3F6B7D; --accent-purple-tint: #E1E6EA; --accent-pink-tint: #E2EBEE;
    --text-dark: #1F2933; --text-muted: #64748B; --border: #DCE3E8;
    --green: #4C9A73; --orange: #C68A2E; --danger: #C1495A; --blue: #4A7A9D;
  }
  html[data-theme="escuro"] {
    --bg: #131417; --surface: #232427; --surface-alt: #2E3136; --lavender: #3D4046;
    --purple: #9AA0A8; --pink: #6E7278; --pink-light: #2E3136; --accent-purple: #A6ABB2;
    --accent-pink: #7C8188; --accent-purple-tint: #2E3136; --accent-pink-tint: #2A2C30;
    --text-dark: #F6F7F8; --text-muted: #9BA1A8; --border: #3D4046;
    --green: #7FD9A8; --orange: #E8B563; --danger: #EA8E96; --blue: #8FBEEA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, a, select, input, label, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus, button:focus-visible { outline: none; }
button:focus-visible { box-shadow: 0 0 0 2px var(--accent-purple); }
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  #boot-loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; font-family: 'Manrope', sans-serif; color: var(--text-muted); background: var(--bg);
  }
  .pf-spinner {
    width: 46px; height: 46px; border-radius: 50%;
    background: conic-gradient(from 0deg, #6B5B95 0deg, #6B5B95 175deg, transparent 175deg, transparent 180deg, #4A7A9D 180deg, #4A7A9D 355deg, transparent 355deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
    animation: pf-spin .85s linear infinite;
  }
  @keyframes pf-spin { to { transform: rotate(360deg); } }

  /* Tela de login / cadastro */
  .auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(circle at 15% 10%, var(--lavender), transparent 55%),
                radial-gradient(circle at 85% 90%, var(--pink-light), transparent 55%), var(--bg);
    font-family: 'Manrope', sans-serif; color: var(--text-dark);
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; padding: 30px 26px; box-shadow: 0 20px 50px rgba(134,87,201,.12);
  }
  .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; flex-shrink: 0;
    overflow: hidden;
  }
  .brand-mark-img { width: 100%; height: 100%; object-fit: cover; }
  .brand-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; line-height: 1.1; color: var(--text-dark); }
  .brand-sub { font-size: 11px; color: var(--text-muted); }
  .auth-title { font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 6px; color: var(--text-dark); }
  .auth-subtitle { font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.5; }
  .auth-config-warning {
    display: flex; gap: 8px; align-items: flex-start; background: #FBEDD8; color: #8A5A0F; font-size: 11.5px;
    padding: 10px 12px; border-radius: 12px; margin-bottom: 14px; line-height: 1.5;
  }
  .auth-config-warning code { background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px; }
  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 11px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
    font-family: inherit; font-weight: 700; font-size: 13px; color: var(--text-dark); cursor: pointer;
  }
  .google-btn:hover { background: var(--surface-alt); }
  .google-btn:disabled { opacity: .55; cursor: not-allowed; }
  .auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 11px; color: var(--text-muted); }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    font-family: inherit; font-size: 13px; color: var(--text-dark); outline: none;
  }
  .field input:focus { border-color: var(--accent-purple); }
  .btn-primary {
    border: none; border-radius: 12px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    color: white; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); font-family: inherit;
  }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .auth-submit { margin-top: 2px; }
  .auth-error, .auth-info {
    display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 9px 11px; border-radius: 10px;
  }
  .auth-error { background: var(--accent-pink-tint); color: var(--danger); }
  .auth-info { background: var(--accent-purple-tint); color: var(--green); }
  .auth-links { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 18px; }
  .auth-links button {
    border: none; background: transparent; color: var(--accent-purple); font-weight: 700; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .auth-links button:hover { text-decoration: underline; }
  .auth-support { text-align: center; font-size: 10.5px; color: var(--text-muted); margin-top: 20px; }
  .password-field-wrap { position: relative; display: block; width: 100%; box-sizing: border-box; }
  .password-field-wrap input { width: 100%; box-sizing: border-box; padding-right: 40px !important; }
  .password-eye-btn {
    position: absolute; right: 2px; top: 0; bottom: 0; margin: auto 0;
    height: 30px; width: 30px;
    border: none !important; outline: none !important; background: transparent !important;
    color: var(--text-muted); cursor: pointer; box-shadow: none !important;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .password-eye-btn:hover, .password-eye-btn:focus, .password-eye-btn:focus-visible { color: var(--accent-purple); outline: none !important; box-shadow: none !important; }
  .auth-support a { color: var(--accent-purple); font-weight: 600; text-decoration: none; }
  .auth-support a:hover { text-decoration: underline; }
  .auth-credit { text-align: center; font-size: 9.5px; color: var(--text-muted); opacity: .7; margin-top: 6px; font-style: italic; }

  /* Banner de instalar app (PWA) */
  .install-banner {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 300;
    max-width: 460px; margin: 0 auto; background: #2E2740; color: #FFFFFF;
    border-radius: 16px; padding: 11px 12px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,.28); font-family: 'Manrope', sans-serif;
  }
  .install-banner-icon { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; }
  .install-banner-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .install-banner-text strong { font-size: 12.5px; }
  .install-banner-text span { font-size: 11px; color: #C9B8E8; line-height: 1.4; }
  .install-banner-btn {
    border: none; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white;
    font-weight: 700; font-size: 12px; padding: 8px 14px; border-radius: 100px; cursor: pointer;
    font-family: inherit; flex-shrink: 0;
  }
  .install-banner-close {
    border: none; background: transparent; color: #C9B8E8; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 4px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
</head>
<body>
<div id="root">
  <div id="boot-loader">
    <div class="pf-spinner"></div>
  </div>
</div>
<script>
  // Rede de segurança fora do React: se em 12s o app React ainda não
  // tiver substituído a tela de carregamento (ex: CDN bloqueada, sem
  // internet, extensão do navegador travando scripts), mostra um aviso
  // com o que checar, em vez de spinner infinito sem explicação.
  window.__lumenBootTimeout = setTimeout(function () {
    var loader = document.getElementById("boot-loader");
    if (loader && !loader.dataset.errorShown) {
      loader.dataset.errorShown = "1";
      loader.innerHTML =
        '<div style="font-size:28px;">⚠️</div>' +
        '<div style="max-width:280px;text-align:center;line-height:1.5;">' +
        'O app está demorando demais para carregar, sem mostrar um erro específico.<br/>' +
        'Tire um print desta tela e verifique sua conexão com a internet. Tente também ' +
        'recarregar a página ou abrir em outro navegador.' +
        '</div>';
    }
  }, 12000);

  // O service worker (usado pra "instalar" o app) está desativado por
  // enquanto: se alguma versão antiga dele já ficou instalada no
  // Registra o service worker e guarda o resultado real (deu certo ou não, e por quê)
  // pra podermos ver isso depois direto nas Configurações do app, sem precisar do DevTools.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        try {
          localStorage.setItem("plamily-sw-status", JSON.stringify({ ok: true, scope: reg.scope, time: Date.now() }));
        } catch (e) {}
      }).catch(function (err) {
        try {
          localStorage.setItem("plamily-sw-status", JSON.stringify({ ok: false, error: String(err && err.message || err), time: Date.now() }));
        } catch (e) {}
      });
    });
  } else {
    try {
      localStorage.setItem("plamily-sw-status", JSON.stringify({ ok: false, error: "Este navegador n\u00E3o suporta Service Worker", time: Date.now() }));
    } catch (e) {}
  }
</script>
<script type="module" src="./app.js?v=82"></script>
</body>
